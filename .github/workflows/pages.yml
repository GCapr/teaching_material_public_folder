# Builds the GitHub Pages site for this repository and publishes it.
#
#   https://gcapr.github.io/teaching_material_public_folder/
#     index.html                      landing page (site/index.html)
#     instagram-data-lab/             JupyterLite: runs Python in the student's browser
#     youtube_topics_lab.html         ECOSM 2025 lab, carried over from its own branch
#
# One-time setup: Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions.
# After that, every push to the ECOSM-2026 branch rebuilds and republishes the site.
name: Build and deploy the course site

on:
  push:
    branches: [ECOSM-2026]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Check out the ECOSM 2025 branch (to keep its lab page online)
        uses: actions/checkout@v4
        with:
          ref: ECOSM_2025_SciencesPo
          path: _previous/ECOSM_2025_SciencesPo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the JupyterLite build tools
        run: python -m pip install -r instagram-data-lab/requirements.txt

      - name: Build the JupyterLite site
        working-directory: instagram-data-lab
        run: jupyter lite build --contents content --output-dir ../dist/instagram-data-lab

      - name: Assemble the site
        run: |
          cp -r site/. dist/
          cp _previous/ECOSM_2025_SciencesPo/*.html dist/ 2>/dev/null || true
          touch dist/.nojekyll
          find dist -maxdepth 2 -type f | sort | head -40

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
